<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="animated-background"></div>
    
    <div class="container">
        <h1>Minhas Tarefas</h1>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Pesquisar...">
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <span id="progressText">0% Concluído</span>
        </div>

        <div class="filter-container">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Digite sua tarefa...">
            <button id="addButton">Adicionar</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
